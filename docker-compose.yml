version: '3.8'

services:
  nids:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: ebpf-nids
    privileged: true
    network_mode: host
    restart: unless-stopped
    volumes:
      - /lib/modules:/lib/modules:ro
      - /usr/src:/usr/src:ro
    command: ["wlo1"]

  # Web UI to view the live NIDS output
  frontend:
    image: amir20/dozzle:latest
    container_name: nids-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOZZLE_FILTER=name=ebpf-nids  # Only show the NIDS container by default
      - DOZZLE_TAILSIZE=300           # Load the last 300 logs immediately
